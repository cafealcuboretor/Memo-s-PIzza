name: Firebase Hosting de Memo’s Pizza

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: test -f dist/tienda-virtual/browser/index.html
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: memos-pizza-build
          path: dist/tienda-virtual/browser
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: memos-pizza-build
          path: dist/tienda-virtual/browser
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: timbresabormango
          workload_identity_provider: projects/180961621274/locations/global/workloadIdentityPools/memos-pizza-github/providers/github-actions
          service_account: github-action-1442026610@timbresabormango.iam.gserviceaccount.com
      - name: Publicar Memo’s Pizza
        run: npx --yes firebase-tools@15.36.0 deploy --only hosting:memos-family-dinner --project timbresabormango --non-interactive
